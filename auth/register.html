<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | RISE FUNDED</title>

    <meta
        name="description"
        content="Create your RISE FUNDED trader account."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="auth.css">

    <link rel="icon" type="image/svg+xml" href="../assets/logo-white.svg">

</head>

<body>

<div class="auth-page register-page">

    <!-- Background -->
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <div class="grid-background"></div>

    <!-- Back -->
    <a href="../index.html" class="back-home">
        <span>←</span>
        Back to Home
    </a>

    <main class="auth-container register-container">

        <!-- Brand -->
        <div class="brand">

            <img
                src="../assets/logo-white.svg"
                alt="RISE FUNDED"
                class="brand-mark"
            />

            <div class="brand-name">
                RISE <span>FUNDED</span>
            </div>

        </div>

        <!-- Register Card -->
        <section class="auth-card register-card">

            <div class="auth-heading">

                <div class="mini-badge">
                    <span class="status-dot"></span>
                    Start Your Trading Journey
                </div>

                <h1>
                    Create <span>Account.</span>
                </h1>

                <p>
                    Join RISE FUNDED and get access to your
                    professional trader dashboard.
                </p>

            </div>

            <!-- Messages -->
            <div id="authError" class="auth-message error-message"></div>

            <div id="authSuccess" class="auth-message success-message"></div>

            <form id="registerForm" autocomplete="on">

                <!-- Name -->
                <div class="form-grid">

                    <!-- First Name -->
                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ◉
                            </span>

                            <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                placeholder="John"
                                autocomplete="given-name"
                                required
                            >

                        </div>

                    </div>

                    <!-- Last Name -->
                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ◉
                            </span>

                            <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                placeholder="Smith"
                                autocomplete="family-name"
                                required
                            >

                        </div>

                    </div>

                </div>

                <!-- Username -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            @
                        </span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="johntrader"
                            autocomplete="username"
                            minlength="3"
                            maxlength="30"
                            required
                        >

                    </div>

                    <small class="input-hint">
                        3–30 characters. Letters, numbers and underscore only.
                    </small>

                </div>

                <!-- Email -->
                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>

                <!-- Country / Phone -->
                <div class="form-grid">

                    <!-- Country -->
                    <div class="form-group">

                        <label for="country">
                            Country
                        </label>

                        <div class="input-wrapper select-wrapper">

                            <span class="input-icon">
                                ◎
                            </span>

                            <select
                                id="country"
                                name="country"
                                autocomplete="country-name"
                                required
                            >

                                <option value="">
                                    Select Country
                                </option>

                                <option value="Afghanistan">Afghanistan</option>
                                <option value="Albania">Albania</option>
                                <option value="Algeria">Algeria</option>
                                <option value="Australia">Australia</option>
                                <option value="Austria">Austria</option>
                                <option value="Bangladesh">Bangladesh</option>
                                <option value="Belgium">Belgium</option>
                                <option value="Brazil">Brazil</option>
                                <option value="Canada">Canada</option>
                                <option value="China">China</option>
                                <option value="France">France</option>
                                <option value="Germany">Germany</option>
                                <option value="India">India</option>
                                <option value="Indonesia">Indonesia</option>
                                <option value="Iran">Iran</option>
                                <option value="Iraq">Iraq</option>
                                <option value="Italy">Italy</option>
                                <option value="Japan">Japan</option>
                                <option value="Malaysia">Malaysia</option>
                                <option value="Netherlands">Netherlands</option>
                                <option value="New Zealand">New Zealand</option>
                                <option value="Nigeria">Nigeria</option>
                                <option value="Pakistan">Pakistan</option>
                                <option value="Philippines">Philippines</option>
                                <option value="Qatar">Qatar</option>
                                <option value="Russia">Russia</option>
                                <option value="Saudi Arabia">Saudi Arabia</option>
                                <option value="Singapore">Singapore</option>
                                <option value="South Africa">South Africa</option>
                                <option value="South Korea">South Korea</option>
                                <option value="Spain">Spain</option>
                                <option value="Sweden">Sweden</option>
                                <option value="Switzerland">Switzerland</option>
                                <option value="Turkey">Turkey</option>
                                <option value="UAE">United Arab Emirates</option>
                                <option value="United Kingdom">United Kingdom</option>
                                <option value="United States">United States</option>

                            </select>

                        </div>

                    </div>

                    <!-- Phone -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ☎
                            </span>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="+93 700 000 000"
                                autocomplete="tel"
                                required
                            >

                        </div>

                    </div>

                </div>

                <!-- Password -->
                <div class="form-grid">

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="registerPassword"
                                name="password"
                                placeholder="Create password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="registerPassword"
                                aria-label="Show password"
                            >
                                ◉
                            </button>

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Repeat password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                                aria-label="Show password"
                            >
                                ◉
                            </button>

                        </div>

                    </div>

                </div>

                <!-- Password Strength -->
                <div class="password-strength">

                    <div class="strength-bars">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                    <span id="passwordStrengthText">
                        Password strength
                    </span>

                </div>

                <!-- Terms -->
                <div class="agreement-area">

                    <label class="checkbox-label agreement-label">

                        <input
                            type="checkbox"
                            id="agreeTerms"
                            required
                        >

                        <span class="custom-checkbox"></span>

                        <span>
                            I agree to the
                            <a href="#" target="_blank">
                                Terms & Conditions
                            </a>
                        </span>

                    </label>

                    <label class="checkbox-label agreement-label">

                        <input
                            type="checkbox"
                            id="agreePrivacy"
                            required
                        >

                        <span class="custom-checkbox"></span>

                        <span>
                            I agree to the
                            <a href="#" target="_blank">
                                Privacy Policy
                            </a>
                        </span>

                    </label>

                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    id="registerButton"
                    class="primary-button"
                >

                    <span class="button-text">
                        Create Account
                    </span>

                    <span class="button-loader"></span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>

            <!-- Login -->
            <div class="auth-switch">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Login
                </a>

            </div>

        </section>

        <!-- Footer -->
        <div class="auth-footer">

            <span>
                © 2026 RISE FUNDED
            </span>

            <span class="footer-separator">
                •
            </span>

            <a href="#">
                Terms
            </a>

            <a href="#">
                Privacy
            </a>

        </div>

    </main>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
